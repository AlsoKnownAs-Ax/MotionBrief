name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      # pnpm comes from package.json's packageManager pin.
      - run: corepack enable

      # Its postinstall also fetches the native binaries deps.json pins (a few seconds), so every
      # run proves the pins still match upstream on both platforms. Jobs that need no binaries
      # can set MOTIONBRIEF_SKIP_DEPS=1.
      - run: pnpm install --frozen-lockfile
        env:
          # The producer's Puppeteer never fetches a Chrome; exports run the pinned chrome-headless-shell.
          PUPPETEER_SKIP_DOWNLOAD: "1"

      - run: pnpm lint

      - run: pnpm typecheck

      # Tier 1 (seams 1 and 2 on hand-written inputs) and tier 2 (the replay corpus, replay-corpus.test.ts), at zero
      # cost, with the binaries the install above fetched.
      - run: pnpm test
